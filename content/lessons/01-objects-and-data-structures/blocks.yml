# Keys are block ids '<section>#<n>' as printed by tools/content/extract.py.
#   after:            run these blocks first, in the same sandbox, when this block depends on earlier state
#   nondeterministic: output may differ between runs or engines; the block must still run without error
#   skip:             not runnable (reason required)
#   stdin:            text fed to input()
