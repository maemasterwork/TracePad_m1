    quizzes:
    - id: q1
      tag: file-modes
      question:
        en: Try It 2. What happens if you open an existing file with mode <code>"w"</code> and write nothing?
        fa: امتحان کنید 2. اگر فایل موجودی را با حالت <code>"w"</code> باز کنید و چیزی ننویسید چه می‌شود؟
      options:
      - en: The file is left unchanged.
        fa: فایل بدون تغییر می‌ماند.
      - en: The file is emptied.
        fa: فایل خالی می‌شود.
      - en: Python raises FileExistsError.
        fa: پایتون خطای FileExistsError می‌دهد.
      - en: The file is deleted.
        fa: فایل حذف می‌شود.
      correct: 1
      why:
        en: Opening with <code>"w"</code> erases the old content immediately, even if you never write. Use <code>"a"</code> to append.
        fa: باز کردن با <code>"w"</code> بلافاصله محتوای قبلی را پاک می‌کند، حتی اگر هیچ‌چیز ننویسید. برای افزودن از <code>"a"</code> استفاده کنید.
    - id: q2
      tag: file-iter
      question:
        en: Try It 3. Why is <code>for line in f:</code> better than <code>f.readlines()</code> for a 2 GB log file?
        fa: امتحان کنید 3. چرا برای یک فایل لاگ 2 گیگابایتی <code>for line in f:</code> بهتر از <code>f.readlines()</code> است؟
      options:
      - en: It is shorter to type.
        fa: نوشتنش کوتاه‌تر است.
      - en: It reads one line at a time instead of loading the whole file into memory.
        fa: هر بار یک خط می‌خواند و کل فایل را وارد حافظه نمی‌کند.
      - en: <code>readlines()</code> cannot read big files at all.
        fa: <code>readlines()</code> اصلاً نمی‌تواند فایل بزرگ بخواند.
      - en: It also sorts the lines.
        fa: خط‌ها را هم مرتب می‌کند.
      correct: 1
      why:
        en: Iterating over the file object is lazy and memory efficient. <code>readlines()</code> builds a list of every line at once.
        fa: پیمایش شیء فایل تنبل و کم‌مصرف است. <code>readlines()</code> فهرست همهٔ خط‌ها را یک‌جا می‌سازد.
    - id: q3
      tag: file-modes
      question:
        en: Which mode refuses to overwrite a file that already exists?
        fa: کدام حالت از بازنویسی فایلی که از قبل وجود دارد خودداری می‌کند؟
      options:
      - en: <code>"w"</code>
        fa: <code>"w"</code>
      - en: <code>"a"</code>
        fa: <code>"a"</code>
      - en: <code>"x"</code>
        fa: <code>"x"</code>
      - en: <code>"r+"</code>
        fa: <code>"r+"</code>
      correct: 2
      why:
        en: <code>"x"</code> creates the file exclusively and raises an error if it exists. That is the safe choice for a backup tool.
        fa: <code>"x"</code> فایل را به‌صورت انحصاری می‌سازد و اگر وجود داشته باشد خطا می‌دهد. برای ابزار پشتیبان‌گیری انتخاب امنی است.
    - id: q4
      tag: file-encoding
      question:
        en: What should you always pass when reading or writing text files, especially with Persian text?
