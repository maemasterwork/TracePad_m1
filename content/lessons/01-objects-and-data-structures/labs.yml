      - en: True and False
        fa: True و False
      - en: False and True
        fa: False و True
      - en: False and False
        fa: False و False
      correct: 1
      why:
        en: <code>==</code> compares values and <code>is</code> compares identity. They are two separate lists with equal contents. Use <code>is</code> only for <code>None</code>.
        fa: <code>==</code> مقدارها را و <code>is</code> هویت را مقایسه می‌کند. این‌ها دو لیست جدا با محتوای برابرند. <code>is</code> را فقط برای <code>None</code> به کار ببرید.
    exercises:
    - id: e1
      prompt:
        en: 'Homework 5. Set <code>is_leap</code> with one boolean expression: a year is a leap year if it is divisible by 4 and either not divisible by 100 or divisible by 400.'
        fa: 'تکلیف 5. <code>is_leap</code> را با یک عبارت بولی بسازید: سال کبیسه است اگر بر 4 بخش‌پذیر باشد و یا بر 100 بخش‌پذیر نباشد یا بر 400 بخش‌پذیر باشد.'
      starter: |
        year = 2024

        is_leap = False

        print(is_leap)
      solution: |
        year = 2024

        is_leap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)

        print(is_leap)
      param:
        pattern: ^year\s*=.*$
        flags: m
      tests:
      - out: 'True'
      - set: year = 1900
        out: 'False'
      - set: year = 2000
        out: 'True'
      - set: year = 2023
        out: 'False'
      - set: year = 2100
        out: 'False'
      hints:
      - en: 'Start with the rule that must always hold: <code>year % 4 == 0</code>.'
        fa: 'با قاعده‌ای شروع کنید که همیشه باید برقرار باشد: <code>year % 4 == 0</code>.'
      - en: 'The second part is an <code>or</code>: not a multiple of 100, or a multiple of 400.'
        fa: 'بخش دوم یک <code>or</code> است: مضرب 100 نباشد، یا مضرب 400 باشد.'
      - en: Combine them with <code>and</code> and put the <code>or</code> part in parentheses.
        fa: آن‌ها را با <code>and</code> ترکیب کنید و بخش <code>or</code> را داخل پرانتز بگذارید.
    - id: e2
      prompt:
        en: Example 1 as an exercise. Remove the duplicates from <code>names</code> and print the unique names as a sorted list. For the starting list the answer is <code>['ali', 'neda', 'sara']</code>.
        fa: مثال 1 به‌صورت تمرین. تکراری‌های <code>names</code> را حذف کنید و نام‌های یکتا را به‌صورت لیست مرتب چاپ کنید. برای لیست اولیه جواب <code>['ali', 'neda', 'sara']</code> است.
      starter: |
        names = ["ali", "sara", "ali", "neda", "sara"]

        result = names

        print(result)
      solution: |
        names = ["ali", "sara", "ali", "neda", "sara"]

        result = sorted(set(names))

        print(result)
      param:
        pattern: ^names\s*=.*$
        flags: m
      tests:
      - out: '[''ali'', ''neda'', ''sara'']'
      - set: names = ["x"]
        out: '[''x'']'
      - set: names = ["b", "a", "b", "c", "a"]
        out: '[''a'', ''b'', ''c'']'
      hints:
      - en: A set keeps each item only once.
        fa: مجموعه هر عضو را فقط یک بار نگه می‌دارد.
      - en: Turn the list into a set with <code>set(names)</code>.
        fa: لیست را با <code>set(names)</code> به مجموعه تبدیل کنید.
      - en: Sets have no order, so wrap the result in <code>sorted()</code>.
        fa: مجموعه‌ها ترتیب ندارند، پس نتیجه را در <code>sorted()</code> بگذارید.
