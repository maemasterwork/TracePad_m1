# Lesson 1 labs. Imported from the prototype (tools/content/import_prototype_labs.mjs); this file is now the source of truth.
# Learner-visible text has en and fa. HTML in text is limited to code, em, strong, br (see labs.schema.json).
lesson: 01-objects-and-data-structures
schema: 1
chapters:
  1:
    predictions:
    - id: p1
      tag: true-division
      code: print(7 / 2, 7 // 2, 7 % 2)
      answer: 3.5 3 1
      why:
        en: <code>/</code> always returns a float (3.5). <code>//</code> keeps the whole part (3). <code>%</code> is what is left over (1), because 7 = 2 × 3 + 1.
        fa: <code>/</code> همیشه عدد اعشاری برمی‌گرداند (3.5). <code>//</code> فقط بخش صحیح را نگه می‌دارد (3). <code>%</code> باقی‌مانده است (1)، چون 7 = 2 × 3 + 1.
    - id: p2
      tag: floor-neg
      code: print(-7 // 2, -7 % 2)
      answer: -4 1
      why:
        en: <code>//</code> rounds toward negative infinity, so -3.5 becomes -4. Python keeps the rule a = (a // b) × b + a % b, so <code>-7 % 2</code> is 1.
        fa: <code>//</code> به سمت منفی بی‌نهایت گرد می‌کند، پس <code>-3.5</code> به <code>-4</code> تبدیل می‌شود. پایتون قاعدهٔ a = (a // b) × b + a % b را حفظ می‌کند؛ بنابراین <code>-7 % 2</code> برابر 1 است.
    - id: p3
      tag: float-eq
      code: |-
        print(0.1 + 0.2)
        print(0.1 + 0.2 == 0.3)
      answer: |-
        0.30000000000000004
        False
      why:
        en: Floats are stored in binary, and 0.1 and 0.2 have no exact binary form, so the sum is a hair above 0.3. Never compare floats with <code>==</code>. Use <code>math.isclose()</code>, or <code>Decimal</code> for money.
        fa: اعشاری‌ها در مبنای دو ذخیره می‌شوند و 0.1 و 0.2 در این مبنا دقیق نمایش داده نمی‌شوند، پس حاصل‌جمع کمی بیشتر از 0.3 است. اعشاری‌ها را هرگز با <code>==</code> مقایسه نکنید؛ از <code>math.isclose()</code> یا برای پول از <code>Decimal</code> استفاده کنید.
    - id: p4
      tag: round-even
      code: print(round(2.5), round(3.5), int(7.9))
      answer: 2 4 7
      why:
        en: '<code>round()</code> sends exact halves to the nearest even number: 2.5 becomes 2 and 3.5 becomes 4. <code>int()</code> cuts off the decimals without rounding.'
        fa: '<code>round()</code> مقدارهای دقیقاً وسط را به نزدیک‌ترین عدد زوج می‌برد: 2.5 می‌شود 2 و 3.5 می‌شود 4. <code>int()</code> اعشار را بدون گرد کردن حذف می‌کند.'
    - id: p5
      tag: precedence
      code: print(-2 ** 2, (-2) ** 2)
      answer: -4 4
      why:
        en: Power binds tighter than the unary minus, so <code>-2 ** 2</code> means <code>-(2 ** 2)</code>. Parentheses change the order.
        fa: توان از منفی یگانی قوی‌تر عمل می‌کند، پس <code>-2 ** 2</code> یعنی <code>-(2 ** 2)</code>. پرانتز ترتیب را عوض می‌کند.
    - id: p6
      tag: floor-neg
      code: print(10 / 3, 10 // 3, 10 % 3, -10 // 3, -10 % 3)
      answer: 3.3333333333333335 3 1 -4 2
      why:
        en: This is Try It 3. <code>10 / 3</code> is a float, <code>10 // 3</code> is 3, and <code>-10 // 3</code> floors down to -4, which leaves <code>-10 % 3</code> = 2 because -10 = 3 × (-4) + 2.
        fa: این همان «امتحان کنید» شمارهٔ 3 است. <code>10 / 3</code> اعشاری است، <code>10 // 3</code> برابر 3 است و <code>-10 // 3</code> به پایین گرد می‌شود و -4 می‌دهد؛ پس <code>-10 % 3</code> برابر 2 است، چون -10 = 3 × (-4) + 2.
    quizzes: []
    exercises:
    - id: e1
      prompt:
        en: 'Example 2 as an exercise: turn a number of seconds into a clock. Fill in <code>hours</code>, <code>minutes</code> and <code>seconds</code> using only <code>//</code> and <code>%</code>. For 98765 seconds the program must print <code>27:26:05</code>.'
        fa: 'مثال 2 به‌صورت تمرین: ثانیه‌ها را به ساعت تبدیل کنید. مقدارهای <code>hours</code>، <code>minutes</code> و <code>seconds</code> را فقط با <code>//</code> و <code>%</code> بنویسید. برای 98765 ثانیه برنامه باید <code>27:26:05</code> را چاپ کند.'
      starter: |
        total_seconds = 98765

        # Use // and % to fill in these three variables
        hours = 0
        minutes = 0
        seconds = 0

        print(f"{hours:02d}:{minutes:02d}:{seconds:02d}")
      solution: |
        total_seconds = 98765

        hours = total_seconds // 3600
        minutes = (total_seconds % 3600) // 60
        seconds = total_seconds % 60

        print(f"{hours:02d}:{minutes:02d}:{seconds:02d}")
      param:
        pattern: ^total_seconds\s*=.*$
        flags: m
      tests:
      - out: '27:26:05'
      - set: total_seconds = 3725
        out: 01:02:05
      - set: total_seconds = 59
        out: 00:00:59
      - set: total_seconds = 86400
        out: '24:00:00'
      hints:
      - en: One hour is 3600 seconds. Which operator tells you how many whole 3600s fit into a number?
        fa: یک ساعت 3600 ثانیه است. کدام عملگر می‌گوید چند تا 3600 کامل در یک عدد جا می‌شود؟
      - en: '<code>//</code> counts whole units and <code>%</code> gives what is left. After taking out the hours, work with the leftover: <code>total_seconds % 3600</code>.'
        fa: '<code>//</code> تعداد واحدهای کامل را می‌شمارد و <code>%</code> باقی‌مانده را می‌دهد. بعد از جدا کردن ساعت‌ها، با باقی‌مانده کار کنید: <code>total_seconds % 3600</code>.'
      - en: 'Minutes are the whole 60s inside that leftover. Seconds are what remains after removing whole minutes: <code>total_seconds % 60</code>.'
        fa: 'دقیقه‌ها تعداد 60های کامل در آن باقی‌مانده‌اند. ثانیه‌ها همان چیزی است که بعد از جدا کردن دقیقه‌های کامل می‌ماند: <code>total_seconds % 60</code>.'
    - id: e2
      prompt:
        en: 'Homework 3, digit sum: take a 4-digit integer, pull out each digit using only <code>//</code> and <code>%</code> (no strings), and print the sum. For 4729 the answer is 22.'
        fa: 'تکلیف 3، مجموع رقم‌ها: یک عدد چهاررقمی را بگیرید، هر رقم را فقط با <code>//</code> و <code>%</code> جدا کنید (بدون رشته) و مجموع را چاپ کنید. برای 4729 جواب 22 است.'
      starter: |
        number = 4729

        # Pull out each digit using only // and %
        thousands = 0
        hundreds = 0
        tens = 0
        ones = 0

        print(thousands + hundreds + tens + ones)
      solution: |
        number = 4729

        thousands = number // 1000
        hundreds = number // 100 % 10
        tens = number // 10 % 10
        ones = number % 10

        print(thousands + hundreds + tens + ones)
      param:
        pattern: ^number\s*=.*$
        flags: m
      tests:
      - out: '22'
      - set: number = 1234
        out: '10'
      - set: number = 9999
        out: '36'
      - set: number = 1000
        out: '1'
      - set: number = 5005
        out: '10'
      hints:
      - en: The last digit is the remainder when you divide by 10.
        fa: رقم آخر همان باقی‌ماندهٔ تقسیم بر 10 است.
      - en: To reach the tens digit, first drop the ones with <code>// 10</code>, then take <code>% 10</code>.
        fa: برای رسیدن به رقم دهگان، ابتدا یکان را با <code>// 10</code> حذف کنید و بعد <code>% 10</code> بگیرید.
      - en: 'Hundreds: <code>number // 100 % 10</code>. Thousands: <code>number // 1000</code>.'
        fa: 'صدگان: <code>number // 100 % 10</code>. هزارگان: <code>number // 1000</code>.'
  2:
    memory_demo: |
      a = [1, 2, 3]
      b = a
      c = a.copy()
      b.append(4)
      n = 5
      m = n
      n = 10
    predictions:
    - id: p1
      tag: rebinding
      code: |-
        a = 5
        b = a
        a = 10
        print(a, b)
      answer: 10 5
      why:
        en: After <code>b = a</code> both names point at 5. <code>a = 10</code> moves only the name a to a new object. b still points at 5.
        fa: بعد از <code>b = a</code> هر دو نام به 5 اشاره می‌کنند. <code>a = 10</code> فقط نام a را به شیء تازه‌ای می‌برد. b هنوز به 5 اشاره می‌کند.
    - id: p2
      tag: alias
      code: |-
        a = [1, 2, 3]
        b = a
        b.append(4)
        print(a)
      answer: '[1, 2, 3, 4]'
      why:
        en: <code>b = a</code> makes a second name for the same list. <code>append</code> changes that one list, so a shows the change too.
        fa: <code>b = a</code> یک نام دوم برای همان لیست می‌سازد. <code>append</code> همان یک لیست را تغییر می‌دهد، پس a هم تغییر را نشان می‌دهد.
    - id: p3
      tag: alias
      code: |-
        a = [1, 2, 3]
        b = a.copy()
        b.append(4)
        print(a, a is b)
      answer: '[1, 2, 3] False'
      why:
        en: <code>copy()</code> builds a new list, so b has its own box. <code>a is b</code> asks whether both names point at the same object. Here they do not.
        fa: <code>copy()</code> لیست تازه‌ای می‌سازد، پس b جعبهٔ خودش را دارد. <code>a is b</code> می‌پرسد آیا هر دو نام به یک شیء اشاره می‌کنند. اینجا نه.
    - id: p4
      tag: swap
      code: |-
        a, b = 1, 2
        a, b = b, a
        print(a, b)
      answer: 2 1
      why:
        en: The right side is packed into a tuple first, <code>(b, a)</code>, and then unpacked into the names. No temporary variable is needed.
        fa: ابتدا سمت راست در یک تاپل <code>(b, a)</code> جمع می‌شود و بعد در نام‌ها باز می‌شود. به متغیر موقت نیازی نیست.
    - id: p5
      tag: augmented
      code: |-
        score = 10
        score += 5
        score -= 3
        score *= 2
        score //= 5
        score **= 2
        print(score)
      answer: '16'
      why:
        en: 'Track it line by line: 15, 12, 24, 4 (24 // 5), then 16 (4 squared).'
        fa: 'خط‌به‌خط دنبال کنید: 15، 12، 24، 4 (24 // 5) و بعد 16 (مربع 4).'
    - id: p6
      tag: accumulate
      code: |-
        scores = [60, 90, 90]
        total = 0
        for s in scores:
            total = s
        print("Average:", total / len(scores))
      answer: 'Average: 30.0'
      why:
        en: Each pass replaces total with s instead of adding to it. After the loop total is 90, and 90 / 3 is 30.0.
        fa: هر دور، total با s جایگزین می‌شود و به آن اضافه نمی‌شود. بعد از حلقه total برابر 90 است و 90 / 3 می‌شود 30.0.
    quizzes:
    - id: q1
      tag: naming
      question:
        en: Try It 1. Which of these is a valid variable name?
        fa: امتحان کنید 1. کدام‌یک از این‌ها نام معتبر متغیر است؟
      options:
      - en: <code>2total</code>
        fa: <code>2total</code>
      - en: <code>my var</code>
        fa: <code>my var</code>
      - en: <code>_x</code>
        fa: <code>_x</code>
      - en: <code>first-name</code>
        fa: <code>first-name</code>
      correct: 2
      why:
        en: Names can use letters, digits and underscores but cannot start with a digit, contain spaces or hyphens, or be keywords. <code>total_2</code>, <code>_x</code> and <code>Name</code> are valid. <code>2total</code>, <code>my var</code>, <code>for</code> and <code>first-name</code> are not.
        fa: نام می‌تواند حرف، رقم و زیرخط داشته باشد اما نمی‌تواند با رقم شروع شود، فاصله یا خط‌تیره داشته باشد یا کلمهٔ کلیدی باشد. <code>total_2</code>، <code>_x</code> و <code>Name</code> معتبرند. <code>2total</code>، <code>my var</code>، <code>for</code> و <code>first-name</code> نامعتبرند.
    - id: q2
      tag: shadowing
      question:
        en: Why is <code>list = [1, 2, 3]</code> a bad line?
        fa: چرا <code>list = [1, 2, 3]</code> کار بدی است؟
      options:
      - en: It is a syntax error.
        fa: خطای نحوی است.
      - en: It hides the built-in <code>list()</code>, so <code>list("abc")</code> later fails.
        fa: تابع داخلی <code>list()</code> را پنهان می‌کند و بعداً <code>list("abc")</code> خطا می‌دهد.
      - en: Lists cannot be stored in variables.
        fa: لیست را نمی‌شود در متغیر ذخیره کرد.
      - en: Python converts it to a tuple.
        fa: پایتون آن را به تاپل تبدیل می‌کند.
      correct: 1
      why:
        en: This is called shadowing. The name <code>list</code> now points at your list instead of the built-in function. Use names like <code>items</code> or <code>numbers</code>.
        fa: به این کار سایه‌انداختن می‌گویند. نام <code>list</code> حالا به لیست شما اشاره می‌کند و نه به تابع داخلی. از نام‌هایی مثل <code>items</code> یا <code>numbers</code> استفاده کنید.
    exercises:
    - id: e1
      prompt:
        en: <code>b = a</code> only adds a second name. Make <code>c</code> a real, independent copy of <code>a</code>, so that <code>c.append(4)</code> leaves <code>a</code> unchanged.
        fa: <code>b = a</code> فقط نام دومی اضافه می‌کند. <code>c</code> را یک کپی واقعی و مستقل از <code>a</code> کنید تا <code>c.append(4)</code> روی <code>a</code> اثری نداشته باشد.
      starter: |
        a = [1, 2, 3]
        b = a

        # c must be an independent copy of a
        c = None

        c.append(4)
      solution: |
        a = [1, 2, 3]
        b = a

        # c must be an independent copy of a
        c = a.copy()

        c.append(4)
      param:
        pattern: ^a\s*=.*$
        flags: m
      tests:
      - post: print(a, c, a is c)
        out: '[1, 2, 3] [1, 2, 3, 4] False'
      - set: a = [9]
        post: print(a, c, a is c)
        out: '[9] [9, 4] False'
      - set: a = []
        post: print(a, c, a is c)
        out: '[] [4] False'
      hints:
      - en: Press Show memory. After the <code>c = ...</code> line, c should point at its own box, not at the box that a points at.
        fa: روی «نمایش حافظه» بزنید. بعد از خط <code>c = ...</code> باید c به جعبهٔ خودش اشاره کند، نه جعبه‌ای که a به آن اشاره می‌کند.
      - en: Lists have a method that returns a new list with the same items. Slicing the whole list does the same.
        fa: لیست‌ها متدی دارند که لیست تازه‌ای با همان عضوها برمی‌گرداند. برش دادن کل لیست هم همین کار را می‌کند.
      - en: The method is called <code>copy</code>. Call it on <code>a</code> and assign the result to <code>c</code>.
        fa: نام این متد <code>copy</code> است. آن را روی <code>a</code> صدا بزنید و نتیجه را به <code>c</code> بدهید.
    - id: e2
      prompt:
        en: Bug hunt. The program should print the average of the scores, which is <code>80.0</code> here. Change one line to fix it.
        fa: شکار باگ. برنامه باید میانگین نمره‌ها را چاپ کند که اینجا <code>80.0</code> است. با تغییر یک خط آن را درست کنید.
      starter: |
        scores = [60, 90, 90]

        total = 0
        for s in scores:
            total = s

        print("Average:", total / len(scores))
      solution: |
        scores = [60, 90, 90]

        total = 0
        for s in scores:
            total += s

        print("Average:", total / len(scores))
      param:
        pattern: ^scores\s*=.*$
        flags: m
      tests:
      - out: 'Average: 80.0'
      - set: scores = [10, 20]
        out: 'Average: 15.0'
      - set: scores = [100]
        out: 'Average: 100.0'
      - set: scores = [1, 2, 3, 4]
        out: 'Average: 2.5'
      hints:
      - en: Run it and compare with (60 + 90 + 90) / 3. Is the printed number too big or too small?
        fa: اجرا کنید و با (60 + 90 + 90) / 3 مقایسه کنید. عدد چاپ‌شده بزرگ‌تر است یا کوچک‌تر؟
      - en: Inside the loop, total should grow on every pass. Does <code>total = s</code> make it grow?
        fa: داخل حلقه، total باید در هر دور بزرگ‌تر شود. آیا <code>total = s</code> این کار را می‌کند؟
      - en: Use an augmented assignment that adds s to total.
        fa: از انتساب افزایشی استفاده کنید که s را به total اضافه می‌کند.
  3:
    predictions:
    - id: p1
      tag: slice-stop
      code: |-
        word = "Python"
        print(word[1:4], word[:2], word[-1])
      answer: yth Py n
      why:
        en: Indexes run P=0, y=1, t=2, h=3. <code>[1:4]</code> takes 1, 2 and 3, and stops before 4. <code>[:2]</code> starts at the beginning. <code>[-1]</code> is the last character.
        fa: 'اندیس‌ها: P=0، y=1، t=2، h=3. <code>[1:4]</code> اندیس‌های 1 و 2 و 3 را می‌گیرد و قبل از 4 می‌ایستد. <code>[:2]</code> از ابتدا شروع می‌کند. <code>[-1]</code> آخرین نویسه است.'
    - id: p2
      tag: slice-step
      code: print("Python"[::-1], "Python"[1:5:2])
      answer: nohtyP yh
      why:
        en: A step of -1 walks backwards, which reverses the string. <code>[1:5:2]</code> takes indexes 1 and 3, giving y and h.
        fa: گام <code>-1</code> به عقب می‌رود و رشته را برعکس می‌کند. <code>[1:5:2]</code> اندیس‌های 1 و 3 را برمی‌دارد و y و h را می‌دهد.
    - id: p3
      tag: method-returns-new
      code: |-
        name = "hello"
        name.upper()
        print(name)
      answer: hello
      why:
        en: <code>name.upper()</code> builds a new string, but nothing stores it. The old string is untouched, so name is still hello. Write <code>name = name.upper()</code> to keep the result.
        fa: <code>name.upper()</code> رشتهٔ تازه‌ای می‌سازد اما جایی ذخیره‌اش نمی‌کنید. رشتهٔ قبلی دست‌نخورده می‌ماند، پس name همچنان hello است. برای نگه داشتن نتیجه بنویسید <code>name = name.upper()</code>.
    - id: p4
      tag: replace-count
      code: |-
        s = "banana"
        print(s.count("an"), s.find("na"), s.replace("a", "o", 2))
      answer: 2 2 bonona
      why:
        en: <code>count("an")</code> finds two matches. <code>find("na")</code> returns the first index, 2. <code>replace("a", "o", 2)</code> changes only the first two a's.
        fa: <code>count("an")</code> دو تطابق پیدا می‌کند. <code>find("na")</code> اولین اندیس را برمی‌گرداند، یعنی 2. <code>replace("a", "o", 2)</code> فقط دو a اول را عوض می‌کند.
    - id: p5
      tag: case-membership
      code: |-
        last = "Lovelace"
        print("love" in last, "love" in last.lower())
      answer: False True
      why:
        en: Membership tests are case sensitive. <code>"love"</code> is not inside <code>"Lovelace"</code> because of the capital L, but it is inside the lowercased copy.
        fa: آزمون عضویت به بزرگی و کوچکی حروف حساس است. <code>"love"</code> به‌خاطر L بزرگ داخل <code>"Lovelace"</code> نیست، اما در نسخهٔ با حروف کوچک هست.
    - id: p6
      tag: repeat
      code: print("abc" * 2 + "d" * 0)
      answer: abcabc
      why:
        en: Multiplying a string by 0 gives an empty string, and adding an empty string changes nothing. This is Try It 2.
        fa: ضرب یک رشته در 0 رشتهٔ خالی می‌دهد و اضافه کردن رشتهٔ خالی چیزی را عوض نمی‌کند. این همان «امتحان کنید» شمارهٔ 2 است.
    quizzes:
    - id: q1
      tag: find-index
